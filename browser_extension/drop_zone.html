<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCM Image Drop</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Yu Gothic UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #zone {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      border: 1px dashed #575264; border-radius: 8px; background: #15151b; color: #aaa6b2;
      font-size: 11px; line-height: 1.45; text-align: center; cursor: copy; user-select: none;
      transition: border-color .12s ease, background .12s ease, color .12s ease;
    }
    #zone.dragging { border-color: #8c7dca; background: #211e2d; color: #f0ecff; }
    #zone.busy { border-color: #6f65a2; color: #ded8f2; }
    #zone.error { border-color: #b6666d; color: #f3a3aa; }
    #picker { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  </style>
</head>
<body>
  <div id="zone">
    <span id="label">画像をここへドラッグ＆ドロップ</span>
    <input id="picker" type="file" accept=".png,.jpg,.jpeg,.webp,.bmp" multiple aria-label="画像を追加">
  </div>
  <script src="drop_zone.js"></script>
</body>
</html>
